name: Release Builds (Windows + WebGL) + Deploy to itch.io

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            buildName: Overlink
            buildPath: build/Windows
            zipName: Overlink-Windows.zip
            itchChannel: windows
          - targetPlatform: WebGL
            buildName: Overlink
            buildPath: build/WebGL
            zipName: Overlink-WebGL.zip
            itchChannel: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ matrix.buildName }}
          buildPath: ${{ matrix.buildPath }}
          versioning: Tag

      - name: Zip build
        run: |
          cd ${{ matrix.buildPath }}
          zip -r ../../${{ matrix.zipName }} .
          cd ../..

      - name: Upload build to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zipName }}

      - name: Install Butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip
          chmod +x butler
          ./butler --version

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.ref_name }}"
          fi
          ./butler push ${{ matrix.buildPath }} ${{ secrets.ITCH_USERNAME }}/${{ secrets.ITCH_GAME_SLUG }}:${{ matrix.itchChannel }} --userversion "$VERSION"
