name: Release Builds (Windows + WebGL) + Deploy to itch.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach build assets to (e.g. v0.18.1). Leave blank to use the branch ref."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # game-ci/unity-builder always writes to <buildsPath>/<targetPlatform>.
          # buildPath here MUST match that, or the Zip step has nothing to find.
          - targetPlatform: StandaloneWindows64
            buildName: Overlink
            buildPath: build/StandaloneWindows64
            zipName: Overlink-Windows.zip
            itchChannel: windows
          - targetPlatform: WebGL
            buildName: Overlink
            buildPath: build/WebGL
            zipName: Overlink-WebGL.zip
            itchChannel: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ matrix.buildName }}
          # `buildPath` is NOT a valid input for game-ci/unity-builder@v4
          # (it was silently ignored, which caused the v0.18.1 failure).
          buildsPath: build
          versioning: Tag

      - name: Zip build
        run: |
          set -euo pipefail
          BUILD_DIR="${{ matrix.buildPath }}"
          ZIP_NAME="${{ matrix.zipName }}"

          if [ ! -d "$BUILD_DIR" ]; then
            echo "::error::Build output directory '$BUILD_DIR' not found. Contents of build/:"
            ls -la build || true
            exit 1
          fi

          if [ -z "$(ls -A "$BUILD_DIR")" ]; then
            echo "::error::Build output directory '$BUILD_DIR' is empty"
            exit 1
          fi

          # Zip the CONTENTS of the build dir (not the dir itself) so players
          # get Overlink.exe at the archive root.
          ( cd "$BUILD_DIR" && zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" . )

          ls -lh "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: Resolve release tag
        id: meta
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Upload build to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: ${{ matrix.zipName }}
          # Without this, a re-run fails on the duplicate asset name left by the
          # previous attempt (softprops errors with 'already_exists').
          overwrite: true

      - name: Install Butler
        run: |
          # broth moved from broth.itch.ovh to broth.itch.zone; the .ovh host
          # no longer resolves (curl exit 6), which failed the v0.18.1 runs.
          set -euo pipefail
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip
          rm -f butler.zip
          chmod +x butler
          ./butler version

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push "${{ matrix.buildPath }}" \
            "${{ secrets.ITCH_USERNAME }}/${{ secrets.ITCH_GAME_SLUG }}:${{ matrix.itchChannel }}" \
            --userversion "${{ steps.meta.outputs.tag }}"
